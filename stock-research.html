<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equity Research - Pål Sandström</title>
    <style>
        /* === CLASSIC 2000s RESET & BODY === */
        body {
            font-family: Tahoma, Verdana, Arial, sans-serif;
            background-color: #EBF3FA; /* Classic pale Windows-esque blue */
            color: #333333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* === MAIN WRAPPER (Responsive) === */
        #container {
            width: 85%;
            max-width: 1200px;
            background-color: #FFFFFF;
            border: 1px solid #8FABCC;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            min-height: 90vh;
        }

        /* === GLOSSY HEADER === */
        #header {
            background: linear-gradient(to bottom, #4A90E2 0%, #003399 100%);
            border-bottom: 2px solid #002266;
            padding: 20px;
            color: #FFFFFF;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title h1 {
            margin: 0;
            font-size: 28px;
            font-weight: normal;
            text-shadow: 1px 1px 2px #000000;
        }

        /* === 2000s 3D TACTILE BUTTONS === */
        .btn-classic {
            background: linear-gradient(to bottom, #F9F9F9 0%, #E0E0E0 100%);
            border: 2px outset #FFFFFF;
            border-bottom-color: #999999;
            border-right-color: #999999;
            color: #000000;
            padding: 8px 16px;
            text-decoration: none;
            font-family: Tahoma, sans-serif;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-classic:active {
            border: 2px inset #FFFFFF;
            border-bottom-color: #FFFFFF;
            border-right-color: #FFFFFF;
            border-top-color: #999999;
            border-left-color: #999999;
            padding: 9px 15px 7px 17px; 
            background: #E0E0E0;
        }

        /* === CONTENT LAYOUT === */
        #main-body {
            padding: 30px;
            font-size: 14px;
            line-height: 1.6;
            flex: 1;
            background-color: #FFFFFF;
        }

        /* Classic Grid for Stocks */
        .stock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }

        /* Classic Stock Card Panel */
        .stock-card {
            background-color: #F4F8FC;
            border: 1px solid #B0C4DE;
            padding: 15px;
            text-decoration: none;
            color: #333333;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .stock-card:hover {
            background-color: #E6F0FA;
            border-color: #003399;
        }

        .stock-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            margin-bottom: 10px;
            border-bottom: 1px dotted #B0C4DE;
            padding-bottom: 8px;
        }
        .stock-name { 
            color: #003399; 
            font-size: 16px; 
            font-weight: bold; 
            margin: 0; 
        }
        
        /* Classic Ticker Badge */
        .stock-ticker { 
            background: #003399; 
            color: #FFFFFF; 
            padding: 2px 6px; 
            font-size: 11px; 
            font-family: 'Courier New', Courier, monospace; 
            border: 1px inset #002266;
        }
        
        .stock-info { 
            font-size: 13px; 
            margin: 4px 0; 
            color: #666666;
        }
        .stock-info strong {
            color: #333333;
        }

        /* === FOOTER === */
        #footer {
            background-color: #F4F8FC;
            border-top: 1px solid #8FABCC;
            text-align: center;
            padding: 10px;
            font-size: 11px;
            color: #666666;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            #header { flex-direction: column; gap: 15px; text-align: center; }
            #container { width: 95%; }
        }
    </style>
</head>
<body>

<div id="container">
    
    <!-- Glossy Header -->
    <div id="header">
        <div class="header-title">
            <h1>Equity Research</h1>
        </div>
        <a href="index.html" class="btn-classic">« Back to Main Hub</a>
    </div>

    <!-- Main Content Body -->
    <div id="main-body">
        <div class="stock-grid" id="stockGrid"></div>
    </div>

    <!-- Classic Footer -->
    <div id="footer">
        &copy; 2026 Pål Sandström. Best viewed in 1024x768 resolution.
    </div>

</div>

<script>
    // Your original stock data array remains untouched
    const stocks = [
        { id: 'nichirei',     name: 'Nichirei Corp',     ticker: '2871.T', country: '🇯🇵 Japan', industry: 'Food & Logistics' },
        { id: 'optex_group',  name: 'OPTEX GROUP Co.',   ticker: '6914.T', country: '🇯🇵 Japan', industry: 'Industrial Sensors & Automation' }
    ];

    const gridContainer = document.getElementById('stockGrid');

    // Rendering logic updated with the classic HTML structure
    stocks.forEach(stock => {
        const card = document.createElement('a');
        card.className = 'stock-card';
        card.href = `research/${stock.id}.html`;
        
        card.innerHTML = `
            <div class="stock-header">
                <h3 class="stock-name">${stock.name}</h3>
                <span class="stock-ticker">${stock.ticker}</span>
            </div>
            <div class="stock-info"><strong>Location:</strong> ${stock.country}</div>
            <div class="stock-info"><strong>Sector:</strong> ${stock.industry}</div>
        `;
        
        gridContainer.appendChild(card);
    });
</script>

</body>
</html>
